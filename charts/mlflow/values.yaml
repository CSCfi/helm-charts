authentication:
  enabled: false

# --- MLflow subchart values (community chart vendored under charts/) ---
mlflow:
  image:
    repository: ghcr.io/mlflow/mlflow
    # Defaults to chart appVersion when empty
    tag: "v3.14.0-full"
    pullPolicy: IfNotPresent

  mlflow:
    artifactsDestination: "/mlflow/artifacts"
    backendStoreUri: "sqlite:////mlflow/mlflow.db"

  storage:
    enabled: true

  garbageCollection:
    enabled: true
    schedule: "0 2 * * 0"
    olderThan: "30d"

  ingress:
    enabled: true
    className: openshift-default

  server:
    flag_options:
      - enable_workspaces
      - serve_artifacts

  podSecurityContext:
    runAsUser: null
    fsGroup: null
