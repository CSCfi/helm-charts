authentication:
  enabled: false

# --- MLflow subchart values (community chart vendored under charts/) ---
mlflow:
  image:
    repository: ghcr.io/mlflow/mlflow
    # Defaults to chart appVersion when empty
    tag: "v3.14.0-full"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  mlflow:
    artifactsDestination: "/mlflow/artifacts"
    backendStoreUri: "sqlite:////mlflow/mlflow.db"

  storage:
    enabled: true

  garbageCollection:
    enabled: true
    schedule: "0 2 * * 0"
    olderThan: "30d"

  server:
    flag_options:
      - disable-workspaces
      - serve-artifacts
    value_options:
      workers: 2

  ingress:
    enabled: false

  env:
    - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
      value: "false"
    - name: MLFLOW_DISABLE_TELEMETRY
      value: "true"
    - name: DO_NOT_TRACK
      value: "true"
